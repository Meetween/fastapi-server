[project]
name = "fastapi-server"
version = "0.5.0"
description = "Meeting intelligence API for Meetween, backed by Triton"
readme = "README.md"
license = "Apache-2.0"
# The upper bound follows torch 2.3.1, which ships wheels up to CPython 3.12.
# Remove it when torch leaves the dependency list.
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10.0",
    "fastapi>=0.104.1",
    "httpx>=0.25.0",
    "librosa",
    "motor>=3.3.0",
    "numpy>=1.24.3",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "pydub",
    "pymongo>=4.9",
    "python-jose>=3.3.0",
    "pyyaml>=6.0.0",
    "soundfile",
    "torch==2.3.1",
    "uvicorn[standard]>=0.24.0",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.21",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

# torch is an array container here, inference runs on Triton. On Linux the CPU wheel is a
# few hundred megabytes instead of the CUDA build. macOS wheels on PyPI are CPU already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=api",
    "--cov=butler",
    "--cov=core",
    "--cov-report=term-missing",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
    "regression: marks tests as regression tests",
    "slow: marks tests as slow running",
]
asyncio_mode = "auto"
