version: 2
updates:
  # Python dependencies, read from pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Order matters: a dependency lands in the first group it matches.
      python-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
      python-security:
        applies-to: "security-updates"
        patterns: ["*"]
    ignore:
      # Majors are handled by hand with a review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned to 2.3.1 until the audio path moves from torch tensors to numpy arrays.
      - dependency-name: "torch"

  # GitHub Actions, pinned by SHA in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]

  # Base images in the Dockerfile, pinned by digest. Patch releases and digest refreshes only:
  # the Python minor is bounded by requires-python, and uv moves together with the uv pinned in
  # ci.yml, so both are bumped by hand.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ghcr.io/astral-sh/uv"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
